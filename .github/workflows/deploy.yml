name: Build and publish to main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Publish built site to the repo root
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          rm -rf assets hero logos shots video index.html 404.html .nojekyll
          cp -r dist/. .
          rm -rf dist

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets hero logos shots video index.html 404.html .nojekyll
          if git diff --staged --quiet; then
            echo "Nothing to publish"
          else
            git commit -m "chore: publish built site [skip ci]"
            git push
          fi
